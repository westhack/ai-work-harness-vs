allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp

# Security floors for transitive dev dependencies (mocha via @vscode/test-cli).
# pnpm ignores package.json "overrides"; it reads them from here.
overrides:
  diff: ^8.0.4
  serialize-javascript: ^7.0.6
